<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Map Simplifier</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="container">
  <h1>K-Map Simplifier</h1>
  <p class="subtitle">Four-Variable Karnaugh Map (A, B, C, D)</p>

  <div class="kmap-section">
    <p class="hint">Click cells to toggle: 0 &rarr; 1 &rarr; X (don't care) &rarr; 0</p>
    <div id="kmap-grid"></div>

    <div id="expression" class="expression hidden"></div>

    <div class="actions">
      <button id="simplify-btn">Simplify</button>
      <button id="reset-btn">Reset</button>
    </div>

    <div id="error-msg" class="error hidden"></div>
  </div>

</div>
<script src="/static/js/script.js"></script>
</body>
</html>
