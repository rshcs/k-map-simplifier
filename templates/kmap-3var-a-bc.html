<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Map Simplifier - 3 Variables (A/BC)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="scanlines"></div>
<div class="container">
  <h1>K-Map Simplifier</h1>
  <p class="subtitle">Three-Variable Karnaugh Map (A / B, C)</p>

  <div class="back-link">
    <a href="/">&larr; Back to Select</a>
  </div>

  <div class="kmap-section">
    <p class="hint">Click cells to toggle: 0 &rarr; 1 &rarr; X (don't care) &rarr; 0</p>
    <div id="kmap-grid"></div>

    <div id="expression" class="expression hidden"></div>

    <div class="actions">
      <button id="simplify-btn">Simplify</button>
      <button id="reset-btn">Reset</button>
    </div>

    <div id="error-msg" class="error hidden"></div>
  </div>

</div>
<div class="footer">K-Map Simplifier v0.1.0</div>
<script>
  window.KMAP_CONFIG = {
    type: '3var-a-bc',
    rows: ['0', '1'],
    cols: ['00', '01', '11', '10'],
    cornerLabel: 'A\\BC',
    variables: ['A', 'B', 'C'],
    cellCount: 8
  };
</script>
<script src="/static/js/script.js"></script>
</body>
</html>
